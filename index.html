<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кайфл — tuz_regina</title>
<style>
:root{
  --bg:#f7eff1; --card:#ffffff; --ink:#2b1812; --muted:#8b7068;
  --berry:#c8264f; --berry-soft:#fbe3ea; --blue:#34406b; --kraft:#b88a5a; --kraft-soft:#f3e6d3;
  --ok:#2f7d4f; --line:#ead9dd;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 96px}
.hero{margin:0 -14px 14px;background:#f9dbe4;border-radius:0 0 22px 22px;overflow:hidden}
.hero svg{display:block;width:100%;height:auto}
.ht{padding:2px 18px 16px;background:var(--ink);color:#fff;margin-top:-1px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:34px;margin:0;letter-spacing:-.5px;line-height:1.15}
.ht p{margin:2px 0 0;color:#e6cfc6;font-size:14.5px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--ink);display:flex;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:#cdb9b1;padding:14px 4px 13px;font-size:15px;font-weight:600;border-top:3px solid transparent}
nav button.on{color:#fff;border-top-color:var(--berry)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.bar{background-color:var(--ink);color:#fff;border-radius:14px;padding:18px 16px 16px;margin-bottom:14px;
  background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);
  background-size:44px 44px;background-position:-1px -1px}
.bar .lab{font-size:14px;color:#e6cfc6}
.bar .big{font-family:Georgia,serif;font-size:42px;font-weight:700;color:#ffb3c6;line-height:1.1;margin:2px 0 12px}
.bar .big.neg{color:#ff8d8d}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row3 div{background:rgba(255,255,255,.1);border-radius:9px;padding:8px 9px}
.row3 b{display:block;font-size:16px}
.row3 span{font-size:12.5px;color:#e6cfc6}
.bar .per{margin-top:11px;font-size:14px;color:#f3e2db}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px}
.card.done{opacity:.72}
h2{font-family:Georgia,serif;font-size:20px;margin:20px 0 8px}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 3px}
input,select{width:100%;font:inherit;padding:10px 10px;border:1.5px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);min-width:0}
input:focus,select:focus{border-color:var(--berry);outline:none}
input.bigin{font-size:26px;font-weight:700;font-family:Georgia,serif;padding:8px 10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.gap{margin-top:9px}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 14px;background:var(--berry);color:#fff;width:100%}
.btn.ghost{background:var(--berry-soft);color:var(--berry)}
.btn.small{width:auto;padding:8px 12px;font-size:14px}
.btn.line{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.name{font-weight:700;font-size:17px}
.muted{color:var(--muted);font-size:13.5px}
.pos{color:var(--ok);font-weight:700}
.neg{color:var(--berry);font-weight:700}
.acts{display:flex;gap:8px;margin-top:10px}
.empty{text-align:center;color:var(--muted);padding:22px 10px;border:1.5px dashed var(--kraft);border-radius:12px;margin-bottom:10px}
.line-item{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.line-item:last-child{border-bottom:0}
.line-item .r{text-align:right;white-space:nowrap}
.tot{display:flex;justify-content:space-between;font-weight:700;padding-top:10px;font-size:17px}
.note{background:#fff7e8;border:1px solid #ecd6a8;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.buy{margin-top:10px;background:var(--kraft-soft);border-left:4px solid var(--kraft);border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14.5px}
.namerow{display:grid;grid-template-columns:1fr 78px 32px;gap:8px;align-items:center}
.x{background:none;border:0;color:var(--muted);font-size:24px;line-height:1;padding:2px 6px}
footer{margin-top:22px;display:flex;gap:8px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.btn{transition:transform .08s}.btn:active{transform:scale(.97)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <svg viewBox="0 0 360 200" role="img" aria-label="Шоколадный трайфл с клубникой и черникой в крафтовой коробочке">
      <defs>
        <linearGradient id="bgp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe6ec"/><stop offset="1" stop-color="#f6c9d7"/></linearGradient>
        <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <g id="sb">
          <path d="M0,-20 C17,-22 27,-5 18,13 C12,24 4,30 0,32 C-4,30 -12,24 -18,13 C-27,-5 -17,-22 0,-20Z" fill="#d92b3b"/>
          <path d="M0,-13 C11,-14 17,-3 11,9 C8,16 3,20 0,22 C-3,20 -8,16 -11,9 C-17,-3 -11,-14 0,-13Z" fill="#f2646f" opacity=".8"/>
          <path d="M0,-8 C-3,0 -2,10 0,18" stroke="#ffe3e3" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".8"/>
          <g fill="#ffe2b4"><ellipse cx="-13" cy="-3" rx="1.3" ry="2"/><ellipse cx="13" cy="-3" rx="1.3" ry="2"/><ellipse cx="-14" cy="6" rx="1.3" ry="2"/><ellipse cx="14" cy="6" rx="1.3" ry="2"/><ellipse cx="-9" cy="15" rx="1.3" ry="2"/><ellipse cx="9" cy="15" rx="1.3" ry="2"/><ellipse cx="0" cy="25" rx="1.3" ry="2"/><ellipse cx="-6" cy="-14" rx="1.3" ry="2"/><ellipse cx="6" cy="-14" rx="1.3" ry="2"/></g>
        </g>
        <g id="bb"><circle r="10" fill="#2c3766"/><circle cx="-3.5" cy="-3.5" r="3.2" fill="#7482c4" opacity=".55"/><circle cy="-3" r="2.8" fill="#161b38"/></g>
      </defs>
      <rect width="360" height="200" fill="url(#bgp)"/>
      <rect y="150" width="360" height="50" fill="#d4ae7c"/>
      <g stroke="#bf9763" stroke-width="1.2" opacity=".7"><path d="M0 162H360M0 176H360M0 190H360"/><path d="M70 150V162M250 162V176M140 176V190M300 150V162"/></g>
      <ellipse cx="180" cy="176" rx="165" ry="9" fill="#2b1812" opacity=".22"/>
      <!-- box -->
      <polygon points="70,58 290,58 337,125 23,125" fill="#cda673"/>
      <polygon points="82,67 278,67 320,119 40,119" fill="#3a2118"/>
      <polygon points="82,67 278,67 320,119 40,119" fill="url(#gloss)"/>
      <polygon points="23,125 337,125 323,174 37,174" fill="#b88a5a"/>
      <polygon points="23,125 337,125 335,131 25,131" fill="#a47a4d"/>
      <path d="M62 150H298" stroke="#a47a4d" stroke-width="1.4" opacity=".5"/>
      <!-- berries -->
      <use href="#sb" transform="translate(116 97) rotate(-24) scale(.82)"/>
      <use href="#sb" transform="translate(184 86) rotate(14) scale(.86)"/>
      <use href="#sb" transform="translate(250 100) rotate(32) scale(.82)"/>
      <use href="#sb" transform="translate(208 108) rotate(-10) scale(.7)"/>
      <use href="#bb" transform="translate(150 108) scale(.82)"/>
      <use href="#bb" transform="translate(148 82) scale(.72)"/>
      <use href="#bb" transform="translate(226 80) scale(.8)"/>
      <use href="#bb" transform="translate(284 108) scale(.76)"/>
      <use href="#bb" transform="translate(88 106) scale(.7)"/>
      <!-- freeze-dried crumbs -->
      <g fill="#f5a9bf"><polygon points="132,76 140,74 142,81 134,83"/><polygon points="206,92 213,91 214,98 207,99"/><polygon points="168,104 175,102 177,109 169,110"/><polygon points="262,84 269,86 266,92 260,90"/><polygon points="108,113 115,112 116,118 109,118"/><polygon points="236,112 243,111 244,117 237,118"/></g>
      <g fill="#ffd3df"><polygon points="170,76 176,76 176,82 170,82"/><polygon points="196,70 202,72 200,77 194,76"/><polygon points="246,74 252,74 252,80 246,80"/><polygon points="126,106 132,106 132,112 126,112"/><polygon points="188,112 194,113 192,118 187,117"/><polygon points="272,96 278,97 276,102 271,101"/><polygon points="226,98 231,98 231,103 226,103"/></g>
    </svg>
    <div class="ht"><h1>Кайфл 🍓</h1><p>tuz_regina · считаем закупку, себестоимость и прибыль</p></div>
  </header>
  <div id="view"></div>
</div>
<nav>
  <button data-tab="calc">Расчёт</button>
  <button data-tab="orders">Заказы</button>
</nav>

<script>
const KEY='trifle-kaifl-v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const todayISO=()=>new Date().toISOString().slice(0,10);

function defaults(){
  return {
    batch:10, price:450, margin:50,
    ingredients:[
      {id:uid(),name:'Сливки 33%',unit:'мл',packSize:1000,packPrice:520,per:80},
      {id:uid(),name:'Шоколад',unit:'г',packSize:500,packPrice:650,per:60},
      {id:uid(),name:'Клубника',unit:'г',packSize:250,packPrice:300,per:40},
      {id:uid(),name:'Черника',unit:'г',packSize:125,packPrice:250,per:15},
      {id:uid(),name:'Сублимированная клубника',unit:'г',packSize:20,packPrice:180,per:3}
    ],
    extras:[
      {id:uid(),name:'Коробка',cost:35},
      {id:uid(),name:'Газ, свет, доставка',cost:10}
    ],
    orders:[]
  };
}
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

let S=load()||defaults();
if(typeof S.batch!=='number')S.batch=10;
if(typeof S.margin!=='number')S.margin=50;
let tab='calc';
let showDone=false;

const rub=n=>(Math.round(n)).toLocaleString('ru-RU').replace(/\u00a0/g,' ')+' ₽';
const num=n=>(Math.round(n*10)/10).toLocaleString('ru-RU');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const val=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)&&n>=0?n:0};
const dm=iso=>{const p=(iso||'').split('-');return p.length===3?p[2]+'.'+p[1]:''};

/* ---------- расчёты ---------- */
function ingUnitCost(i){return i.packSize>0?i.packPrice/i.packSize:0}
function cpp(){
  return S.ingredients.reduce((a,i)=>a+ingUnitCost(i)*i.per,0)+S.extras.reduce((a,e)=>a+e.cost,0);
}
function calcAll(){
  const q=S.batch;
  const rows=S.ingredients.map(i=>{
    const need=q*i.per;
    const packs=(i.packSize>0&&need>0)?Math.ceil(need/i.packSize-1e-9):0;
    return {i,need,packs,pay:packs*i.packPrice,use:need*ingUnitCost(i)};
  });
  const extras=S.extras.reduce((a,e)=>a+e.cost*q,0);
  const use=rows.reduce((a,r)=>a+r.use,0)+extras;
  const cash=rows.reduce((a,r)=>a+r.pay,0)+extras;
  const rev=q*S.price;
  return {q,rows,extras,use,cash,rev,profit:rev-use,per:cpp(),margin:rev>0?(rev-use)/rev*100:0};
}
const openO=()=>S.orders.filter(o=>!o.done);
const doneO=()=>S.orders.filter(o=>o.done);
function sums(list){
  const q=list.reduce((a,o)=>a+o.qty,0);
  const rev=list.reduce((a,o)=>a+o.qty*o.price,0);
  const cost=q*cpp();
  return {q,rev,cost,profit:rev-cost};
}

/* ---------- блоки с живым пересчётом ---------- */
function barHTML(c){
  const perProfit=S.price-c.per;
  return `<div class="lab">Прибыль с партии из ${c.q} шт</div>
    <div class="big ${c.profit<0?'neg':''}">${rub(c.profit)}</div>
    <div class="row3">
      <div><b>${rub(c.rev)}</b><span>выручка</span></div>
      <div><b>${rub(c.use)}</b><span>себестоимость</span></div>
      <div><b>${rub(c.cash)}</b><span>купить на</span></div>
    </div>
    <div class="per">1 шт: себестоимость ${rub(c.per)}, прибыль ${rub(perProfit)}, маржа ${num(c.q>0||S.price>0?(S.price>0?perProfit/S.price*100:0):0)}%</div>`;
}
function shopHTML(c){
  if(!c.q) return `<div class="muted">Введите, сколько штук готовите, и здесь появится список закупки.</div>`;
  let h='';
  c.rows.forEach(r=>{
    h+=`<div class="line-item"><div><div class="name">${esc(r.i.name)}</div><div class="muted">нужно ${num(r.need)} ${r.i.unit}</div></div>
    <div class="r"><div class="name">${r.packs} уп.</div><div class="muted">${rub(r.pay)}</div></div></div>`;
  });
  S.extras.forEach(e=>{
    if(e.cost>0) h+=`<div class="line-item"><div><div class="name">${esc(e.name)}</div><div class="muted">${c.q} × ${rub(e.cost)}</div></div><div class="r name">${rub(e.cost*c.q)}</div></div>`;
  });
  h+=`<div class="tot"><span>Всего в магазин</span><span>${rub(c.cash)}</span></div>`;
  const left=c.cash-c.use;
  if(left>0.5) h+=`<div class="muted gap">Часть продуктов (на ${rub(left)}) останется после партии: упаковки целые. В себестоимость идёт только то, что использовано.</div>`;
  return h;
}
function recHTML(){
  const target=Math.min(95,Math.max(0,S.margin));
  const rec=cpp()/(1-target/100);
  return `<span class="muted">Цена 1 шт для маржи ${num(target)}%</span><b>${rub(Math.ceil(rec/10)*10)}</b>`;
}
function resHTML(r){
  return `<span>Нужно ${num(r.need)} ${r.i.unit}</span><b>купить ${r.packs} уп. · ${rub(r.pay)}</b>`;
}
function live(){
  const c=calcAll();
  const set=(id,h)=>{const el=document.getElementById(id);if(el)el.innerHTML=h};
  set('bar',barHTML(c)); set('shop',shopHTML(c)); set('rec',recHTML());
  c.rows.forEach(r=>set('r-'+r.i.id,resHTML(r)));
  const tc=document.getElementById('cost1'); if(tc)tc.textContent=rub(c.per);
  save();
}

/* ---------- экраны ---------- */
function viewCalc(){
  const c=calcAll();
  const oq=openO().reduce((a,o)=>a+o.qty,0);
  let h=`
  <div class="card">
    <div class="g2">
      <div><label>Сколько штук готовим</label><input class="bigin" type="number" inputmode="numeric" min="0" value="${S.batch}" data-ch="set" data-f="batch"></div>
      <div><label>Цена продажи 1 шт, ₽</label><input class="bigin" type="number" inputmode="decimal" min="0" value="${S.price}" data-ch="set" data-f="price"></div>
    </div>
    ${oq>0?`<div class="gap"><button class="btn ghost small" data-act="fromOrders">Взять из заказов: ${oq} шт</button></div>`:''}
  </div>

  <div class="bar" id="bar">${barHTML(c)}</div>

  <h2>Что купить</h2>
  <div class="card" id="shop">${shopHTML(c)}</div>

  <h2>Рецепт на 1 штуку</h2>
  <div class="note">Цены и граммовки ниже — примеры. Впишите свои: сколько продукта в упаковке, сколько она стоит и сколько уходит на одну порцию. Всё пересчитается сразу.</div>`;
  c.rows.forEach(r=>{
    const i=r.i;
    h+=`<div class="card">
      <div class="namerow">
        <input style="font-weight:700" value="${esc(i.name)}" data-ch="ing" data-id="${i.id}" data-f="name" aria-label="Название продукта">
        <select data-ch="ing" data-id="${i.id}" data-f="unit" aria-label="Единица">${['г','мл','шт'].map(u=>`<option ${u===i.unit?'selected':''}>${u}</option>`).join('')}</select>
        <button class="x" data-act="delIng" data-id="${i.id}" aria-label="Удалить">×</button>
      </div>
      <div class="g3 gap">
        <div><label>На 1 шт, ${i.unit}</label><input type="number" inputmode="decimal" min="0" value="${i.per}" data-ch="ing" data-id="${i.id}" data-f="per"></div>
        <div><label>В упаковке, ${i.unit}</label><input type="number" inputmode="decimal" min="0" value="${i.packSize}" data-ch="ing" data-id="${i.id}" data-f="packSize"></div>
        <div><label>Цена упак., ₽</label><input type="number" inputmode="decimal" min="0" value="${i.packPrice}" data-ch="ing" data-id="${i.id}" data-f="packPrice"></div>
      </div>
      <div class="buy" id="r-${i.id}">${resHTML(r)}</div>
    </div>`;
  });
  h+=`<button class="btn ghost" data-act="addIng">Добавить продукт</button>

  <h2>Прочие расходы на 1 шт</h2>`;
  S.extras.forEach(e=>{
    h+=`<div class="card"><div class="namerow" style="grid-template-columns:2fr 1fr 32px">
      <input value="${esc(e.name)}" data-ch="ext" data-id="${e.id}" data-f="name" aria-label="Название">
      <input type="number" inputmode="decimal" min="0" value="${e.cost}" data-ch="ext" data-id="${e.id}" data-f="cost" aria-label="Сумма, ₽">
      <button class="x" data-act="delExt" data-id="${e.id}" aria-label="Удалить">×</button></div></div>`;
  });
  h+=`<button class="btn ghost" data-act="addExt">Добавить расход</button>

  <h2>Какая цена нужна</h2>
  <div class="card">
    <div class="top"><span class="muted">Себестоимость 1 шт</span><b id="cost1">${rub(c.per)}</b></div>
    <div class="gap"><label>Нужная маржа, %</label><input type="number" inputmode="decimal" min="0" max="95" value="${S.margin}" data-ch="set" data-f="margin"></div>
    <div class="top gap" id="rec">${recHTML()}</div>
  </div>
  <footer>
    <button class="btn line small" data-act="backup">Скопировать копию данных</button>
    <button class="btn line small" data-act="restore">Восстановить</button>
  </footer>
  <p class="muted">Данные хранятся в этом браузере на телефоне. Чтобы перенести их на другое устройство, скопируйте копию и вставьте при восстановлении.</p>`;
  return h;
}

function viewOrders(){
  const t=sums(openO());
  let h=`
  <div class="bar">
    <div class="lab">Ожидаемая прибыль по заказам в работе</div>
    <div class="big ${t.profit<0?'neg':''}">${rub(t.profit)}</div>
    <div class="row3">
      <div><b>${t.q}</b><span>порций</span></div>
      <div><b>${rub(t.rev)}</b><span>выручка</span></div>
      <div><b>${rub(t.cost)}</b><span>себестоимость</span></div>
    </div>
  </div>
  <div class="card">
    <div class="g2">
      <div><label>Кто заказал</label><input id="o-name" placeholder="Имя"></div>
      <div><label>Дата</label><input id="o-date" type="date" value="${todayISO()}"></div>
    </div>
    <div class="g2 gap">
      <div><label>Порций, шт</label><input id="o-qty" type="number" inputmode="numeric" min="1" value="1"></div>
      <div><label>Цена за порцию, ₽</label><input id="o-price" type="number" inputmode="decimal" min="0" value="${S.price}"></div>
    </div>
    <div class="gap"><button class="btn" data-act="addOrder">Добавить заказ</button></div>
  </div>
  <h2>В работе</h2>`;
  const open=openO();
  if(!open.length) h+=`<div class="empty">Заказов в работе нет. Добавьте первый заказ выше.</div>`;
  else h+=`<div class="gap" style="margin:0 0 10px"><button class="btn ghost" data-act="fromOrders">Посчитать закупку на ${t.q} шт</button></div>`;
  open.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(o=>h+=orderCard(o));
  const d=doneO(), td=sums(d);
  h+=`<h2>Выполнено</h2>`;
  if(!d.length) h+=`<div class="empty">Здесь появятся выполненные заказы и реальная прибыль.</div>`;
  else{
    h+=`<div class="card"><div class="top"><span class="muted">Заказов: ${d.length}, порций: ${td.q}</span><span class="pos">Прибыль ${rub(td.profit)}</span></div>
    <div class="muted">Выручка ${rub(td.rev)}, себестоимость ${rub(td.cost)}</div>
    <div class="acts"><button class="btn line small" data-act="toggleDone">${showDone?'Скрыть список':'Показать список'}</button></div></div>`;
    if(showDone) d.slice().reverse().forEach(o=>h+=orderCard(o));
  }
  return h;
}
function orderCard(o){
  const profit=o.qty*(o.price-cpp());
  return `<div class="card ${o.done?'done':''}">
    <div class="top"><span class="name">${esc(o.name||'Без имени')}</span><span class="muted">${dm(o.date)}</span></div>
    <div class="g2 gap">
      <div><label>Порций</label><input type="number" inputmode="numeric" min="1" value="${o.qty}" data-ch="order" data-id="${o.id}" data-f="qty"></div>
      <div><label>Цена за порцию, ₽</label><input type="number" inputmode="decimal" min="0" value="${o.price}" data-ch="order" data-id="${o.id}" data-f="price"></div>
    </div>
    <div class="top gap"><span>Сумма <b>${rub(o.qty*o.price)}</b></span><span class="${profit>=0?'pos':'neg'}">прибыль ${rub(profit)}</span></div>
    <div class="acts">
      <button class="btn ${o.done?'line':''} small" data-act="toggleOrder" data-id="${o.id}">${o.done?'Вернуть в работу':'Готово, отдала'}</button>
      <button class="btn line small" data-act="delOrder" data-id="${o.id}">Удалить</button>
    </div>
  </div>`;
}

/* ---------- отрисовка и события ---------- */
const view=document.getElementById('view');
function render(){
  view.innerHTML= tab==='calc'?viewCalc():viewOrders();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  save();
}
document.querySelector('nav').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  tab=b.dataset.tab;render();window.scrollTo(0,0);
});

function applyField(t){
  const kind=t.dataset.ch, f=t.dataset.f, id=t.dataset.id;
  const numeric=!['name','unit'].includes(f);
  const v=numeric?val(t.value):t.value;
  if(kind==='set'){S[f]=(f==='batch')?Math.round(v):v}
  else if(kind==='order'){const o=S.orders.find(x=>x.id===id);if(o)o[f]=(f==='qty'?Math.max(1,Math.round(v)):v)}
  else if(kind==='ing'){const i=S.ingredients.find(x=>x.id===id);if(i)i[f]=v}
  else if(kind==='ext'){const x=S.extras.find(x=>x.id===id);if(x)x[f]=v}
}
view.addEventListener('input',e=>{
  const t=e.target; if(!t.dataset.ch||tab!=='calc'||t.tagName!=='INPUT')return;
  applyField(t); live();
});
view.addEventListener('change',e=>{
  const t=e.target; if(!t.dataset.ch)return;
  if(tab==='calc'&&t.tagName==='INPUT')return;
  applyField(t); render();
});

view.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, id=b.dataset.id;
  if(a==='addOrder'){
    const qty=Math.max(1,Math.round(val(document.getElementById('o-qty').value)));
    const price=val(document.getElementById('o-price').value);
    S.orders.push({id:uid(),name:document.getElementById('o-name').value.trim(),date:document.getElementById('o-date').value||todayISO(),qty,price,done:false});
  }
  else if(a==='fromOrders'){S.batch=openO().reduce((x,o)=>x+o.qty,0);tab='calc';render();window.scrollTo(0,0);return}
  else if(a==='toggleOrder'){const o=S.orders.find(x=>x.id===id);if(o)o.done=!o.done}
  else if(a==='delOrder'){if(confirm('Удалить заказ?'))S.orders=S.orders.filter(x=>x.id!==id);else return}
  else if(a==='toggleDone'){showDone=!showDone}
  else if(a==='addIng'){S.ingredients.push({id:uid(),name:'Новый продукт',unit:'г',packSize:100,packPrice:0,per:0})}
  else if(a==='delIng'){if(confirm('Удалить продукт из рецепта?'))S.ingredients=S.ingredients.filter(x=>x.id!==id);else return}
  else if(a==='addExt'){S.extras.push({id:uid(),name:'Расход',cost:0})}
  else if(a==='delExt'){S.extras=S.extras.filter(x=>x.id!==id)}
  else if(a==='backup'){
    const txt=JSON.stringify(S);
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>alert('Копия данных скопирована. Сохраните её в заметках или отправьте себе в мессенджер.'),()=>prompt('Скопируйте текст:',txt))}
    else prompt('Скопируйте текст:',txt);
    return;
  }
  else if(a==='restore'){
    const t=prompt('Вставьте копию данных:');
    if(!t)return;
    try{const d=JSON.parse(t);if(d&&d.ingredients&&d.orders){S=d;if(typeof S.batch!=='number')S.batch=10;if(typeof S.margin!=='number')S.margin=50}else throw 0}catch(_){alert('Не получилось прочитать копию. Проверьте, что вставили весь текст.');return}
  }
  render();
});

render();
</script>
</body>
</html>
